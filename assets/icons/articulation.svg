<rect x="3.8" y="5" width="16.4" height="14" rx="2.5" fill="url(#ice)" stroke="#8EC7F4" stroke-width="1"/>
<g fill="#B8DCF8">
  <rect x="6" y="7.3" width="2.4" height="2.1" rx="0.55"/><rect x="9.2" y="7.3" width="2.4" height="2.1" rx="0.55"/><rect x="12.4" y="7.3" width="2.4" height="2.1" rx="0.55"/><rect x="15.6" y="7.3" width="2.4" height="2.1" rx="0.55"/>
  <rect x="6" y="10.6" width="2.4" height="2.1" rx="0.55"/><rect x="15.6" y="10.6" width="2.4" height="2.1" rx="0.55"/>
  <rect x="6" y="13.9" width="2.4" height="2.1" rx="0.55"/><rect x="9.2" y="13.9" width="5.6" height="2.1" rx="0.55"/><rect x="15.6" y="13.9" width="2.4" height="2.1" rx="0.55"/>
</g>
<rect x="9.2" y="10.15" width="5.6" height="3" rx="0.8" fill="url(#blue)"/>
<!-- tiny vector alpha-like IPA mark on the active key -->
<circle cx="11.75" cy="11.65" r="0.72" fill="none" stroke="white" stroke-width="0.6"/>
<path d="M12.45 10.95V12.35" stroke="white" stroke-width="0.6" stroke-linecap="round"/>

