<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="IPA keyboard">
<title>IPA keyboard</title>

<defs>
  <linearGradient id="blue" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2AA8FF"/><stop offset="1" stop-color="#0874EA"/>
  </linearGradient>
  <linearGradient id="ice" x1="5" y1="4" x2="19" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDEEFF"/>
  </linearGradient>
  <linearGradient id="blueSoft" x1="5" y1="4" x2="19" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#EAF7FF"/><stop offset="1" stop-color="#CDE9FF"/>
  </linearGradient>
  <linearGradient id="red" x1="5" y1="4" x2="19" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FF8A84"/><stop offset="1" stop-color="#E85252"/>
  </linearGradient>
  <linearGradient id="green" x1="5" y1="4" x2="19" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#73D995"/><stop offset="1" stop-color="#2FAC65"/>
  </linearGradient>
  <linearGradient id="amber" x1="5" y1="4" x2="19" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFD978"/><stop offset="1" stop-color="#F2A72D"/>
  </linearGradient>
  <linearGradient id="violet" x1="5" y1="4" x2="19" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#A99CFF"/><stop offset="1" stop-color="#7367E8"/>
  </linearGradient>
  <linearGradient id="teal" x1="5" y1="4" x2="19" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#68DED4"/><stop offset="1" stop-color="#25AFA5"/>
  </linearGradient>
  <linearGradient id="pink" x1="5" y1="4" x2="19" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#F5A4CE"/><stop offset="1" stop-color="#D85B9A"/>
  </linearGradient>
